<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #D8C8F0;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { margin-top: 0; color: #7654A8; text-align: center; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    button {
      background: #9673C8;;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px;
      border-bottom: 1px solid #eee;
    }
    .task-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      flex: 1;
    }
    /* Memperjelas ukuran & warna checkbox */
    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
    }
    li.completed span {
      text-decoration: line-through;
      color: #888;
    }
    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h2>To-Do List</h2>
    <form id="todoForm">
      <input type="text" id="taskInput" placeholder="Tambah tugas baru..." required autocomplete="off">
      <button type="submit">Tambah</button>
    </form>
    <ul id="todoList"></ul>
  </div>

  <!-- Pastikan nama file ini persis sama dengan file JS Anda -->
  <script src="script.js"></script>
</body>
</html>
